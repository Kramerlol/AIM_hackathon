{% extends "base.html" %}
{% set step = 2 %}
{% block content %}
<section class="card">
<h1>{{ doc_label }}</h1>
<p class="lead">Requested by {{ requested_by }}.</p>
<div class="summary"><span class="small">Patient</span><b>{{ patient_hint }}</b></div>
{% if error %}<div class="error" role="alert" style="margin-top:16px">{{ error }}</div>{% endif %}
<form method="post" action="/r/{{ token }}/answer" enctype="multipart/form-data" id="answer-form">
  <label for="patient_name">Patient's full name<span class="hint">As written in your document.</span></label>
  <input id="patient_name" name="patient_name" required autocomplete="off" value="{{ values.patient_name or '' }}">

  <label for="patient_birthdate">Patient's birth date<span class="hint">Day, month, year.</span></label>
  <input id="patient_birthdate" name="patient_birthdate" required autocomplete="off"
         placeholder="DD.MM.YYYY" value="{{ values.patient_birthdate or '' }}">

  <fieldset>
    <legend>Document</legend>
    <div class="seg" role="radiogroup" aria-label="How do you want to add the document?">
      <label><input type="radio" name="source" value="paste" {% if values.source != 'upload' %}checked{% endif %}> Paste text</label>
      <label><input type="radio" name="source" value="upload" {% if values.source == 'upload' %}checked{% endif %}> Upload file</label>
    </div>
    <div id="paste-box"><textarea name="content" rows="12" aria-label="Document text" placeholder="Paste the document here">{{ values.content or '' }}</textarea></div>
    <div id="upload-box"><input type="file" name="file" accept=".md,.txt,text/markdown,text/plain" aria-label="Document file"><span class="hint" style="margin-top:6px">.md or .txt</span></div>
  </fieldset>

  <button class="btn block" type="submit" id="send">Send document</button>
  <p class="reassure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> Your answer goes to the requesting doctor only.</p>
</form>
</section>
<script>
(function () {
  var radios = document.querySelectorAll('input[name=source]');
  function sync() {
    var up = document.querySelector('input[name=source]:checked').value === 'upload';
    document.getElementById('paste-box').hidden = up;
    document.getElementById('upload-box').hidden = !up;
  }
  radios.forEach(function (r) { r.addEventListener('change', sync); });
  sync();
  document.getElementById('answer-form').addEventListener('submit', function () {
    var b = document.getElementById('send'); b.disabled = true; b.textContent = 'Sending...';
  });
})();
</script>
{% endblock %}
