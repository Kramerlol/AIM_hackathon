<!DOCTYPE html>
<html>
<head>
    <title>Submit Document</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .container { max-width: 600px; margin: auto; }
        label, textarea, input { display: block; width: 100%; margin-bottom: 1em; }
        textarea { height: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Answer Request</h2>
        <p>Patient: <strong>{{ patient_name }}</strong></p>
        <p>Document type: <strong>{{ doc_type }}</strong></p>
        <form action="/submit/{{ token }}" method="post" enctype="multipart/form-data">
            <label for="patient_name">Patient name (as written in the document)</label>
            <input type="text" id="patient_name" name="patient_name" required>
            <label for="patient_birthdate">Patient birth date (YYYY-MM-DD)</label>
            <input type="date" id="patient_birthdate" name="patient_birthdate" required>
            <label for="content">Paste document content (Markdown)</label>
            <textarea id="content" name="content"></textarea>
            <p>or upload a file:</p>
            <input type="file" name="file" accept=".md,text/markdown,text/plain">
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
